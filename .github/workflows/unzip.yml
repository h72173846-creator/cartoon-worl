name: Unzip source
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/unzip.yml'
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          rm -rf src
          mkdir -p src/v42 src/android
          unzip -o cartoon_world_v42_ready.zip -d src/v42
          unzip -o cartoon_world_android_v3.1.zip -d src/android
      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add src
          git commit -m "Unzip source" || echo "nothing to commit"
          git push
