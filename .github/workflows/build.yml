name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q cartoon_world_v42_ready.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: cartoon_world_android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cartoon-world-apk
          path: cartoon_world_android/app/build/outputs/apk/debug/app-debug.apk
