plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cartoonworld.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cartoonworld.app'
        minSdk 23
        targetSdk 34
        versionCode 7
        versionName '4.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}
