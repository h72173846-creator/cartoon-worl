name: Build Cartoon World APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CartoonWorld.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-world-debug-apk
          path: CartoonWorld.apk
          if-no-files-found: error
      - name: Publish APK as GitHub Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: عالم الكرتون - بناء ${{ github.run_number }}
          files: CartoonWorld.apk
